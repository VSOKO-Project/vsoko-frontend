stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

build_image:
  stage: build
  image: docker:27.5.0
  services:
    - docker:27.5.0-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
      - docker build --pull 
        --build-arg VITE_API_BASE_URL=$VITE_API_BASE_URL 
        --build-arg VITE_DEFAULT_PAGE_SIZE=$VITE_DEFAULT_PAGE_SIZE
        -t $DOCKER_IMAGE_NAME .
      - docker push $DOCKER_IMAGE_NAME
  only:
    - main
    - stage

.deploy_template:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client bash
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\tPort $TARGET_PORT\n\n" > ~/.ssh/config
    - chmod 600 ~/.ssh/config
  script:
      - echo "Deploying to $TARGET_HOST as user $TARGET_USER..."
      - ssh $TARGET_USER@$TARGET_HOST "mkdir -p $INFRA_PATH"
      - scp docker-compose.yml $TARGET_USER@$TARGET_HOST:$INFRA_PATH/docker-compose.yml
      - |
        ssh $TARGET_USER@$TARGET_HOST "
          cd $INFRA_PATH
          
          export CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE
          export DOCKER_TAG=$CI_COMMIT_REF_SLUG
          
          docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
        "

deploy_stage:
  extends: .deploy_template
  variables:
    INFRA_PATH: "$BASE_DEPLOY_PATH/frontend"
    TARGET_PORT: $SSH_PORT_STAGE
    TARGET_HOST: $SSH_HOST_STAGE
    TARGET_USER: $SSH_USER_STAGE
  environment:
    name: staging
  only:
    - stage

deploy_prod:
  extends: .deploy_template
  variables:
    INFRA_PATH: "$BASE_DEPLOY_PATH/frontend"
    TARGET_PORT: $SSH_PORT_PROD
    TARGET_HOST: $SSH_HOST_PROD
    TARGET_USER: $SSH_USER_PROD
  environment:
    name: production
  only:
    - main