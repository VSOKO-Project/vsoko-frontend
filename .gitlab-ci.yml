stages:
  - test
  - build
  - deploy

variables:
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

verify:
  stage: test
  image: node:24-bookworm
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.30.3 --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm test:coverage
    - VITE_API_BASE_URL=/api pnpm build
    - pnpm exec playwright install --with-deps chromium
    - pnpm test:e2e
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - playwright-report/
      - test-results/
      - coverage/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH"

build_image:
  stage: build
  image: docker:27.5.0
  services:
    - docker:27.5.0-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker buildx create --use --driver docker-container --driver-opt network=host
    - docker buildx build --pull --provenance=false --sbom=false
      --build-arg VITE_API_BASE_URL=https://api.vsoko.tech/api
      --build-arg VITE_DEFAULT_PAGE_SIZE=$VITE_DEFAULT_PAGE_SIZE
      --cache-from type=registry,ref=$CI_REGISTRY_IMAGE:buildcache
      --cache-to type=registry,ref=$CI_REGISTRY_IMAGE:buildcache,mode=max
      -t $DOCKER_IMAGE_NAME --push .
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

deploy:
  stage: deploy
  needs: [build_image]
  image:
    name: alpine/kubectl:1.37.1
    entrypoint: [""]
  tags: [saas-linux-small-amd64]
  resource_group: vsoko-production
  environment:
    name: production
    url: https://vsoko.tech
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
  allow_failure: false
  manual_confirmation: "Развернуть фронт VSOKO в production?"
  timeout: 25m
  script:
    - kubectl config use-context vsoko/vsoko-infra:vsoko
    - sed -i "s/REPLACE_WITH_COMMIT_SHA/$CI_COMMIT_SHA/g" k8s/kustomization.yaml
    - kubectl apply --dry-run=server -k k8s/
    - kubectl -n vsoko wait --for=condition=Ready externalsecret/gitlab-registry --timeout=120s
    - kubectl -n vsoko apply -f k8s/service.yaml -f k8s/ingress.yaml
    - kubectl -n vsoko wait --for=create certificate/vsoko-frontend-tls --timeout=60s
    - kubectl -n vsoko wait --for=condition=Ready certificate/vsoko-frontend-tls --timeout=600s
    - kubectl apply -k k8s/
    - kubectl -n vsoko rollout status deployment/vsoko-frontend --timeout=600s
