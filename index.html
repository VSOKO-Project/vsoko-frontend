<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        const preference = localStorage.getItem("vsoko.theme");
        const dark =
          preference === "dark" ||
          (preference !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (_) {}
    </script>
    <style>
      html {
        background: #f7f8fa;
      }
      html[data-theme="dark"] {
        background: #151a20;
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="VSOKO — обратная связь о занятиях, оценки и аналитика качества образования."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>VSOKO — Система оценки качества образования</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
