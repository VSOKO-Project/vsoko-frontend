apiVersion: apps/v1
kind: Deployment
metadata:
  name: vsoko-frontend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: vsoko-frontend
  template:
    metadata:
      labels:
        app: vsoko-frontend
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: gitlab-registry
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: vsoko-frontend
                topologyKey: kubernetes.io/hostname
      containers:
        - name: frontend
          image: registry.gitlab.com/vsoko/vsoko-frontend:REPLACE_WITH_COMMIT_SHA
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
